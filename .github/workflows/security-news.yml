name: Security News

on:
  workflow_dispatch:
  schedule:
    # JST 07:30
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: security-digest-main-writer
  cancel-in-progress: false

jobs:
  security-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate security news digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/security_news.py

      - name: Sync with latest main
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m generated-security-news-output
            git pull --rebase origin main
            git stash pop
          else
            git pull --rebase origin main
          fi

      - name: Commit generated news
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update security news"
          file_pattern: "security-news.md today.md docs/**/security-news.md"
